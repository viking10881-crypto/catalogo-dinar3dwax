<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de producto · Dinar 3D Wax</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("tema-sitio");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
    document.documentElement.dataset.tema = t;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <a href="index.html" class="marca">
      <img src="img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
    </a>
    <nav class="nav-principal">
      <a href="index.html">Categorías</a>
      <a href="calculadora.html">Calculadora de Pesos</a>
      <a href="index.html#recursos">Recursos 3D</a>
      <a href="index.html#faq">Preguntas Frecuentes</a>
    </nav>
    <div class="acciones-cabecera">
      <button type="button" id="toggle-tema" class="toggle-tema" title="Cambiar modo oscuro/claro" aria-label="Cambiar modo oscuro/claro">
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <a href="carrito.html" class="carrito-boton">🛒 (<span data-contador-carrito>0</span>)</a>
    </div>
  </div>
</header>

<div class="contenedor">

  <div id="producto-no-encontrado" class="carrito-vacio oculto">
    <p>No encontramos esa referencia en el catálogo.</p>
    <a href="index.html" class="btn btn-dorado">Volver al catálogo</a>
  </div>

  <div id="ficha-producto" class="ficha-producto">
    <div class="columna-galeria">
      <div id="ficha-render" class="ficha-render"></div>
      <div id="galeria-miniaturas" class="galeria-miniaturas oculto"></div>
    </div>

    <div class="ficha-info">
      <div id="ficha-ref" class="ref"></div>
      <h1 id="ficha-nombre"></h1>
      <p id="ficha-descripcion" class="descripcion"></p>

      <table class="tabla-specs">
        <tbody id="tabla-specs"></tbody>
      </table>

      <div id="bloque-talla" class="selector-bloque">
        <label>Selecciona la talla</label>
        <div id="opciones-talla" class="opciones-talla"></div>
      </div>

      <div class="selector-bloque">
        <label>Cantidad</label>
        <div class="contador">
          <button type="button" id="btn-menos-ficha">−</button>
          <input type="number" id="cantidad-ficha" min="1" value="1">
          <button type="button" id="btn-mas-ficha">+</button>
        </div>
      </div>

      <div class="selector-bloque">
        <label>Precio</label>
        <div id="precio-ficha" class="precio-total"></div>
      </div>

      <button type="button" id="btn-agregar-carrito" class="btn btn-dorado btn-full">Añadir al carrito</button>
    </div>
  </div>

  <section id="seccion-visor-stl" class="seccion-visor-stl oculto">
    <h2 class="titulo-seccion">Vista 3D del modelo</h2>
    <p class="ayuda-visor">Arrastra para rotar, rueda del mouse para acercar/alejar.</p>
    <div id="contenedor-visor-stl" class="contenedor-visor-stl"></div>
  </section>
</div>

<footer class="pie-pagina">
  <div class="contenedor">
    Dinar 3D Wax · Catálogo de modelos para joyeros
  </div>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script src="js/tema.js"></script>
<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/catalogo.js"></script>
<script type="module" src="js/visor-stl.js"></script>
<script src="js/producto.js"></script>
</body>
</html>
