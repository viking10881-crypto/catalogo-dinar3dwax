<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi carrito · Dinar 3D Wax</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("tema-sitio");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
    document.documentElement.dataset.tema = t;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <a href="index.html" class="marca">
      <img src="img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
    </a>
    <nav class="nav-principal" id="nav-principal">
      <div class="nav-categorias">
        <button type="button" id="nav-categorias-toggle" class="nav-cat-toggle" aria-expanded="false" aria-haspopup="true">
          Categorías
          <svg class="nav-cat-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="nav-categorias-panel" class="nav-cat-panel"></div>
      </div>
      <a href="calculadora.html">Calculadora de Pesos</a>
      <a href="index.html#recursos">Recursos 3D</a>
      <a href="index.html#faq">Preguntas Frecuentes</a>
    </nav>
    <div class="acciones-cabecera">
      <button type="button" id="btn-menu-movil" class="btn-menu-movil" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
        <svg class="icono-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg class="icono-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button type="button" id="toggle-tema" class="toggle-tema" title="Cambiar modo oscuro/claro" aria-label="Cambiar modo oscuro/claro">
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <a href="carrito.html" class="carrito-boton">🛒 (<span data-contador-carrito>0</span>)</a>
    </div>
  </div>
</header>

<div class="contenedor pagina-carrito">
  <h1 class="titulo-seccion">Mi carrito</h1>

  <div id="carrito-vacio" class="carrito-vacio oculto">
    <p>Tu carrito está vacío.</p>
    <a href="index.html" class="btn btn-dorado">Ver catálogo</a>
  </div>

  <div id="lista-carrito"></div>

  <div id="resumen-pedido" class="resumen-pedido">
    <div class="linea">
      <span>Subtotal</span>
      <span data-subtotal>$0</span>
    </div>
    <div class="linea total">
      <span>Total</span>
      <span data-total>$0</span>
    </div>
    <a href="checkout.html" class="btn btn-oscuro btn-full" style="margin-top:16px;">Continuar compra</a>
  </div>
</div>

<footer class="pie-pagina">
  <div class="contenedor">
    <div>Dinar 3D Wax · Catálogo de modelos para joyeros</div>
    <div class="creditos-dev">Desarrollado por <a href="https://www.delasoftcompany.com/" target="_blank" rel="noopener">Delasoftcompany</a></div>
  </div>
</footer>

<script src="js/tema.js"></script>
<script src="js/productos.js"></script>
<script src="js/nav-categorias.js"></script>
<script src="js/carrito.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
