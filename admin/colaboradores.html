<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaboradores · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css?v=5">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Colaboradores</h1>
      <button type="button" id="btn-mostrar-form" class="btn btn-dorado">+ Nuevo colaborador</button>
    </div>
    <p style="color:var(--gris); font-size:0.85rem; margin-top:-6px;">
      Diseñadores y demás personas a quienes se les paga por sus servicios. Haz clic en una tarjeta para ver su perfil, su historial de pagos y generar comprobantes.
    </p>

    <form id="form-colaborador" class="formulario-datos oculto" style="max-width:560px; margin-bottom:24px;">
      <input type="hidden" id="colaborador-id">

      <label for="colaborador-foto">Foto</label>
      <div style="display:flex; align-items:center; gap:14px;">
        <div id="vista-foto-colaborador" class="foto-colaborador" style="width:64px; height:64px; margin-bottom:0; font-size:1.1rem;">?</div>
        <input type="file" id="colaborador-foto" accept="image/jpeg,image/png,image/webp" style="flex:1;">
      </div>
      <p id="mensaje-foto" class="mensaje-admin"></p>

      <label for="colaborador-nombre" style="margin-top:14px;">Nombre completo</label>
      <input type="text" id="colaborador-nombre" required>

      <label for="colaborador-rol" style="margin-top:14px;">Rol</label>
      <select id="colaborador-rol">
        <option value="Diseñador">Diseñador</option>
        <option value="Programador">Programador</option>
        <option value="Colaborador administrativo">Colaborador administrativo</option>
        <option value="Otro">Otro</option>
      </select>

      <div style="display:grid; grid-template-columns:1fr 2fr; gap:12px; margin-top:14px;">
        <div>
          <label for="colaborador-tipo-documento">Tipo de documento</label>
          <select id="colaborador-tipo-documento">
            <option value="CC">Cédula (CC)</option>
            <option value="CE">Cédula extranjería (CE)</option>
            <option value="NIT">NIT</option>
            <option value="PAS">Pasaporte</option>
          </select>
        </div>
        <div>
          <label for="colaborador-documento">Número de documento</label>
          <input type="text" id="colaborador-documento">
        </div>
      </div>

      <label for="colaborador-telefono" style="margin-top:14px;">Teléfono</label>
      <input type="text" id="colaborador-telefono">

      <label for="colaborador-correo" style="margin-top:14px;">Correo</label>
      <input type="email" id="colaborador-correo">

      <label for="colaborador-direccion" style="margin-top:14px;">Dirección</label>
      <input type="text" id="colaborador-direccion">

      <h2 class="titulo-seccion" style="font-size:0.85rem; margin-top:20px;">Cuenta para pagos</h2>
      <div style="display:grid; grid-template-columns:2fr 1fr; gap:12px;">
        <div>
          <label for="colaborador-banco-nombre">Banco</label>
          <input type="text" id="colaborador-banco-nombre" placeholder="Ej: Bancolombia">
        </div>
        <div>
          <label for="colaborador-banco-tipo-cuenta">Tipo de cuenta</label>
          <select id="colaborador-banco-tipo-cuenta">
            <option value="Ahorros">Ahorros</option>
            <option value="Corriente">Corriente</option>
          </select>
        </div>
      </div>
      <label for="colaborador-banco-numero-cuenta" style="margin-top:14px;">Número de cuenta</label>
      <input type="text" id="colaborador-banco-numero-cuenta">

      <label for="colaborador-notas" style="margin-top:14px;">Notas</label>
      <textarea id="colaborador-notas" rows="2" placeholder="Opcional"></textarea>

      <label style="margin-top:14px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="colaborador-activo" checked style="width:auto;">
        Activo
      </label>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-dorado">Guardar</button>
        <button type="button" id="btn-cancelar-form" class="btn btn-borde">Cancelar</button>
      </div>
      <p id="mensaje-formulario" class="mensaje-admin"></p>
    </form>

    <div id="grid-colaboradores" class="grid-colaboradores"></div>
    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js?v=5"></script>
<script src="/admin/js/layout.js?v=5"></script>
<script>
let todosLosColaboradores = [];
let fotoSubidaUrl = "";
const idEditarDesdeUrl = new URLSearchParams(window.location.search).get("editar");

function iniciales(nombre) {
  return String(nombre || "?")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((p) => p[0]?.toUpperCase() || "")
    .join("") || "?";
}

function tarjetaColaboradorHTML(c) {
  return `
    <div class="tarjeta-colaborador ${c.activo ? "" : "inactivo"}">
      <button type="button" class="btn-editar-colaborador" data-id="${c.id}" title="Editar colaborador">✎</button>
      <a href="/admin/colaborador.html?id=${c.id}" class="enlace-tarjeta-colaborador">
        ${c.fotoUrl ? `<img src="${c.fotoUrl}" alt="${escaparHtml(c.nombre)}" class="foto-colaborador">` : `<div class="foto-colaborador">${iniciales(c.nombre)}</div>`}
        <span class="nombre">${escaparHtml(c.nombre)}</span>
        <span class="rol-colaborador">${escaparHtml(c.rol)}${c.activo ? "" : " · Inactivo"}</span>
      </a>
    </div>
  `;
}

function renderizarGrid() {
  const grid = document.getElementById("grid-colaboradores");
  if (todosLosColaboradores.length === 0) {
    grid.innerHTML = `<p class="tabla-vacia">Todavía no hay colaboradores registrados.</p>`;
    return;
  }
  grid.innerHTML = todosLosColaboradores.map(tarjetaColaboradorHTML).join("");
}

async function cargarColaboradores() {
  const mensaje = document.getElementById("mensaje-tabla");
  try {
    const r = await fetch("/api/admin/trabajadores");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    todosLosColaboradores = await r.json();
    renderizarGrid();

    if (idEditarDesdeUrl) {
      const colaborador = todosLosColaboradores.find((c) => c.id === Number(idEditarDesdeUrl));
      if (colaborador) mostrarFormulario(colaborador);
    }
  } catch (err) {
    mensaje.textContent = "No se pudo cargar el listado de colaboradores.";
    mensaje.className = "mensaje-admin error";
  }
}

/* ===== Foto: mismo patrón de subida directa a Blob que admin/producto.html ===== */
const TAMANO_MAXIMO_FOTO = 8 * 1024 * 1024;
const LADO_MAYOR_MAXIMO_FOTO = 600;
const EXTENSION_POR_TIPO_FOTO = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };

async function redimensionarFoto(archivo) {
  const bitmap = await createImageBitmap(archivo).catch(() => null);
  if (!bitmap) return archivo;
  const escala = Math.min(1, LADO_MAYOR_MAXIMO_FOTO / Math.max(bitmap.width, bitmap.height));
  const ancho = Math.round(bitmap.width * escala);
  const alto = Math.round(bitmap.height * escala);
  const canvas = document.createElement("canvas");
  canvas.width = ancho;
  canvas.height = alto;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, ancho, alto);
  bitmap.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob || blob.size >= archivo.size) return archivo;
  return new File([blob], archivo.name.replace(/\.\w+$/, ".jpg"), { type: "image/jpeg" });
}

async function subirDirectoABlob(pathname, archivo, contexto) {
  const { upload } = await import("https://esm.sh/@vercel/blob@2.8.0/client");
  const blob = await upload(pathname, archivo, {
    access: "public",
    handleUploadUrl: "/api/admin/upload-token",
    clientPayload: JSON.stringify({ contexto }),
  });
  return blob.url;
}

document.getElementById("colaborador-foto").addEventListener("change", async (e) => {
  const archivo = e.target.files?.[0];
  const mensaje = document.getElementById("mensaje-foto");
  mensaje.textContent = "";
  mensaje.className = "mensaje-admin";
  if (!archivo) return;

  if (!EXTENSION_POR_TIPO_FOTO[archivo.type]) {
    mensaje.textContent = "La foto debe ser JPG, PNG o WEBP.";
    mensaje.className = "mensaje-admin error";
    return;
  }
  if (archivo.size > TAMANO_MAXIMO_FOTO) {
    mensaje.textContent = "La foto supera 8 MB.";
    mensaje.className = "mensaje-admin error";
    return;
  }

  mensaje.textContent = "Subiendo foto...";
  try {
    const optimizada = await redimensionarFoto(archivo);
    const extension = EXTENSION_POR_TIPO_FOTO[optimizada.type] || "jpg";
    const pathname = `colaboradores/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${extension}`;
    fotoSubidaUrl = await subirDirectoABlob(pathname, optimizada, "imagen");
    document.getElementById("vista-foto-colaborador").innerHTML = `<img src="${fotoSubidaUrl}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
    mensaje.textContent = "Foto lista.";
  } catch (err) {
    mensaje.textContent = "No se pudo subir la foto.";
    mensaje.className = "mensaje-admin error";
  }
});

function mostrarFormulario(colaborador) {
  const form = document.getElementById("form-colaborador");
  form.classList.remove("oculto");
  document.getElementById("mensaje-formulario").textContent = "";
  document.getElementById("mensaje-foto").textContent = "";

  fotoSubidaUrl = colaborador ? colaborador.fotoUrl || "" : "";
  document.getElementById("colaborador-id").value = colaborador ? colaborador.id : "";
  document.getElementById("colaborador-nombre").value = colaborador ? colaborador.nombre : "";
  document.getElementById("colaborador-rol").value = colaborador ? colaborador.rol : "Diseñador";
  document.getElementById("colaborador-tipo-documento").value = colaborador ? colaborador.tipoDocumento : "CC";
  document.getElementById("colaborador-documento").value = colaborador ? colaborador.documento : "";
  document.getElementById("colaborador-telefono").value = colaborador ? colaborador.telefono : "";
  document.getElementById("colaborador-correo").value = colaborador ? colaborador.correo : "";
  document.getElementById("colaborador-direccion").value = colaborador ? colaborador.direccion : "";
  document.getElementById("colaborador-banco-nombre").value = colaborador ? colaborador.bancoNombre : "";
  document.getElementById("colaborador-banco-tipo-cuenta").value = colaborador ? colaborador.bancoTipoCuenta : "Ahorros";
  document.getElementById("colaborador-banco-numero-cuenta").value = colaborador ? colaborador.bancoNumeroCuenta : "";
  document.getElementById("colaborador-notas").value = colaborador ? colaborador.notas : "";
  document.getElementById("colaborador-activo").checked = colaborador ? colaborador.activo : true;
  document.getElementById("colaborador-foto").value = "";
  document.getElementById("vista-foto-colaborador").innerHTML = fotoSubidaUrl
    ? `<img src="${fotoSubidaUrl}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`
    : iniciales(colaborador ? colaborador.nombre : "");

  form.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function ocultarFormulario() {
  document.getElementById("form-colaborador").classList.add("oculto");
}

document.getElementById("btn-mostrar-form").addEventListener("click", () => mostrarFormulario(null));
document.getElementById("btn-cancelar-form").addEventListener("click", ocultarFormulario);

document.getElementById("grid-colaboradores").addEventListener("click", (e) => {
  const boton = e.target.closest(".btn-editar-colaborador");
  if (!boton) return;
  e.preventDefault();
  const id = Number(boton.getAttribute("data-id"));
  const colaborador = todosLosColaboradores.find((c) => c.id === id);
  if (colaborador) mostrarFormulario(colaborador);
});

document.getElementById("form-colaborador").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById("mensaje-formulario");
  const id = document.getElementById("colaborador-id").value;

  const datos = {
    nombre: document.getElementById("colaborador-nombre").value.trim(),
    rol: document.getElementById("colaborador-rol").value,
    tipoDocumento: document.getElementById("colaborador-tipo-documento").value,
    documento: document.getElementById("colaborador-documento").value.trim(),
    telefono: document.getElementById("colaborador-telefono").value.trim(),
    correo: document.getElementById("colaborador-correo").value.trim(),
    direccion: document.getElementById("colaborador-direccion").value.trim(),
    fotoUrl: fotoSubidaUrl,
    bancoNombre: document.getElementById("colaborador-banco-nombre").value.trim(),
    bancoTipoCuenta: document.getElementById("colaborador-banco-tipo-cuenta").value,
    bancoNumeroCuenta: document.getElementById("colaborador-banco-numero-cuenta").value.trim(),
    notas: document.getElementById("colaborador-notas").value.trim(),
    activo: document.getElementById("colaborador-activo").checked,
  };

  try {
    const r = await fetch(id ? `/api/admin/trabajadores?id=${id}` : "/api/admin/trabajadores", {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    const resultado = await r.json();
    if (!r.ok) throw new Error(resultado.error || "No se pudo guardar");

    ocultarFormulario();
    await cargarColaboradores();
  } catch (err) {
    mensaje.textContent = err.message;
    mensaje.className = "mensaje-admin error";
  }
});

renderAdminSidebar("colaboradores");
cargarColaboradores();
</script>
</body>
</html>
