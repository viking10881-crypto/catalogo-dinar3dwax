<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabajadores · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Trabajadores</h1>
      <button type="button" id="btn-mostrar-form" class="btn btn-dorado">+ Nuevo trabajador</button>
    </div>
    <p style="color:var(--gris); font-size:0.85rem; margin-top:-6px;">
      Diseñadores y demás personas a quienes se les paga por sus servicios. Para registrar un pago, usa la sección <a href="/admin/pagos.html">Pagos</a>.
    </p>

    <form id="form-trabajador" class="formulario-datos oculto" style="max-width:480px; margin-bottom:24px;">
      <input type="hidden" id="trabajador-id">
      <label for="trabajador-nombre">Nombre</label>
      <input type="text" id="trabajador-nombre" required>

      <label for="trabajador-rol" style="margin-top:14px;">Rol</label>
      <select id="trabajador-rol">
        <option value="Diseñador">Diseñador</option>
        <option value="Otro">Otro</option>
      </select>

      <label for="trabajador-telefono" style="margin-top:14px;">Teléfono</label>
      <input type="text" id="trabajador-telefono" placeholder="Opcional">

      <label for="trabajador-documento" style="margin-top:14px;">Documento</label>
      <input type="text" id="trabajador-documento" placeholder="Cédula (opcional)">

      <label for="trabajador-notas" style="margin-top:14px;">Notas</label>
      <textarea id="trabajador-notas" rows="2" placeholder="Opcional"></textarea>

      <label style="margin-top:14px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="trabajador-activo" checked style="width:auto;">
        Activo
      </label>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-dorado">Guardar</button>
        <button type="button" id="btn-cancelar-form" class="btn btn-borde">Cancelar</button>
      </div>
      <p id="mensaje-formulario" class="mensaje-admin"></p>
    </form>

    <div style="overflow-x:auto;">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-trabajadores"></tbody>
      </table>
    </div>
    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
let todosLosTrabajadores = [];

function filaTrabajadorHTML(t) {
  return `
    <tr>
      <td>${escaparHtml(t.nombre)}</td>
      <td><span class="badge-tipo">${escaparHtml(t.rol)}</span></td>
      <td>${escaparHtml(t.telefono) || "—"}</td>
      <td>${t.activo ? "Activo" : '<span style="color:var(--gris);">Inactivo</span>'}</td>
      <td>
        <div class="acciones-fila">
          <button type="button" class="editar" data-id="${t.id}">Editar</button>
          <button type="button" class="eliminar" data-id="${t.id}">Eliminar</button>
        </div>
      </td>
    </tr>
  `;
}

function renderizarTabla() {
  const cuerpo = document.getElementById("cuerpo-tabla-trabajadores");
  if (todosLosTrabajadores.length === 0) {
    cuerpo.innerHTML = `<tr><td colspan="5" class="tabla-vacia">Todavía no hay trabajadores registrados.</td></tr>`;
    return;
  }
  cuerpo.innerHTML = todosLosTrabajadores.map(filaTrabajadorHTML).join("");
}

async function cargarTabla() {
  const mensaje = document.getElementById("mensaje-tabla");
  try {
    const r = await fetch("/api/admin/trabajadores");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    todosLosTrabajadores = await r.json();
    renderizarTabla();
  } catch (err) {
    mensaje.textContent = "No se pudo cargar el listado de trabajadores.";
    mensaje.className = "mensaje-admin error";
  }
}

function mostrarFormulario(trabajador) {
  const form = document.getElementById("form-trabajador");
  form.classList.remove("oculto");
  document.getElementById("mensaje-formulario").textContent = "";

  document.getElementById("trabajador-id").value = trabajador ? trabajador.id : "";
  document.getElementById("trabajador-nombre").value = trabajador ? trabajador.nombre : "";
  document.getElementById("trabajador-rol").value = trabajador ? trabajador.rol : "Diseñador";
  document.getElementById("trabajador-telefono").value = trabajador ? trabajador.telefono : "";
  document.getElementById("trabajador-documento").value = trabajador ? trabajador.documento : "";
  document.getElementById("trabajador-notas").value = trabajador ? trabajador.notas : "";
  document.getElementById("trabajador-activo").checked = trabajador ? trabajador.activo : true;

  form.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function ocultarFormulario() {
  document.getElementById("form-trabajador").classList.add("oculto");
}

document.getElementById("btn-mostrar-form").addEventListener("click", () => mostrarFormulario(null));
document.getElementById("btn-cancelar-form").addEventListener("click", ocultarFormulario);

document.getElementById("form-trabajador").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById("mensaje-formulario");
  const id = document.getElementById("trabajador-id").value;

  const datos = {
    nombre: document.getElementById("trabajador-nombre").value.trim(),
    rol: document.getElementById("trabajador-rol").value,
    telefono: document.getElementById("trabajador-telefono").value.trim(),
    documento: document.getElementById("trabajador-documento").value.trim(),
    notas: document.getElementById("trabajador-notas").value.trim(),
    activo: document.getElementById("trabajador-activo").checked,
  };

  try {
    const r = await fetch(id ? `/api/admin/trabajadores?id=${id}` : "/api/admin/trabajadores", {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    const resultado = await r.json();
    if (!r.ok) throw new Error(resultado.error || "No se pudo guardar");

    ocultarFormulario();
    await cargarTabla();
  } catch (err) {
    mensaje.textContent = err.message;
    mensaje.className = "mensaje-admin error";
  }
});

document.getElementById("cuerpo-tabla-trabajadores").addEventListener("click", async (e) => {
  const botonEditar = e.target.closest("button.editar");
  if (botonEditar) {
    const id = Number(botonEditar.getAttribute("data-id"));
    const trabajador = todosLosTrabajadores.find((t) => t.id === id);
    if (trabajador) mostrarFormulario(trabajador);
    return;
  }

  const botonEliminar = e.target.closest("button.eliminar");
  if (botonEliminar) {
    const id = botonEliminar.getAttribute("data-id");
    if (!confirm("¿Eliminar este trabajador? También se borrarán los pagos registrados a su nombre.")) return;
    try {
      const r = await fetch(`/api/admin/trabajadores?id=${id}`, { method: "DELETE" });
      if (!r.ok) throw new Error("fallo al eliminar");
      cargarTabla();
    } catch (err) {
      alert("No se pudo eliminar el trabajador.");
    }
  }
});

renderAdminSidebar("trabajadores");
cargarTabla();
</script>
</body>
</html>
