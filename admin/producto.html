<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main" style="max-width:640px;">
  <div class="admin-cabecera-fila">
    <h1 class="titulo-seccion" id="titulo-formulario" style="margin:0;">Nuevo producto</h1>
    <a href="/admin/productos.html" class="btn btn-borde">Volver al listado</a>
  </div>

  <form id="form-producto" class="formulario-datos">
    <label for="referencia">Referencia</label>
    <input type="text" id="referencia" placeholder="Ej: AN-052" required>

    <label for="tipo">Categoría</label>
    <select id="tipo" required>
      <option value="">Selecciona una categoría</option>
      <option value="anillos">Anillos</option>
      <option value="dijes">Dijes</option>
      <option value="aretes">Aretes</option>
      <option value="cadenas">Cadenas</option>
      <option value="pulseras">Pulseras</option>
    </select>

    <label for="subcategoria">Subcategoría (opcional)</label>
    <input type="text" id="subcategoria" list="lista-subcategorias" placeholder="Ej: Solitarios, Argollas Matrimonio...">
    <datalist id="lista-subcategorias"></datalist>
    <p style="color:var(--gris); font-size:0.78rem; margin:4px 0 0;">
      Se usa para armar el árbol de categorías del catálogo público. Escribe una nueva o elige una ya usada.
    </p>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ej: Anillo modelo clásico" required>

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" rows="3" placeholder="Descripción breve del modelo"></textarea>

    <label for="material">Material (cera)</label>
    <input type="text" id="material" placeholder="Ej: Cera casteable rosa">

    <label for="pesoCera">Peso cera (g)</label>
    <input type="number" id="pesoCera" min="0" step="0.01" required>

    <label for="materialTipo">Tipo de material</label>
    <input type="text" id="materialTipo" placeholder="Ej: Oro 18k">

    <label for="peso">Peso material (g, equivalente oro 18k)</label>
    <input type="number" id="peso" min="0" step="0.01" required>

    <label for="precioBase">Precio (COP)</label>
    <input type="number" id="precioBase" min="0" step="100" required>

    <label for="archivo-imagen">Imágenes del producto (JPG, PNG o WEBP, máx. 20 MB c/u — puedes elegir varias a la vez)</label>
    <input type="file" id="archivo-imagen" accept="image/jpeg,image/png,image/webp" multiple>
    <div id="galeria-imagenes-admin" class="galeria-imagenes-admin"></div>
    <p id="mensaje-imagen" class="mensaje-admin"></p>

    <label for="archivo-stl">Archivo STL (vista 3D del modelo, máx. 150 MB)</label>
    <input type="file" id="archivo-stl" accept=".stl">
    <p id="estado-stl" class="mensaje-admin"></p>
    <p id="mensaje-stl" class="mensaje-admin"></p>
    <input type="hidden" id="modeloStl">

    <label for="nueva-talla">Tallas disponibles (dejar vacío si no aplica)</label>
    <div style="display:flex; gap:8px;">
      <input type="text" id="nueva-talla" placeholder="Ej: 7">
      <button type="button" id="btn-agregar-talla" class="btn btn-borde">+ Agregar</button>
    </div>
    <div id="chips-tallas" class="chips-tallas"></div>

    <label>Medidas (opcional, hasta 3)</label>
    <div id="filas-medidas"></div>

    <button type="submit" class="btn btn-dorado btn-full" style="margin-top:20px;">Guardar producto</button>
    <p id="mensaje-formulario" class="mensaje-admin"></p>
  </form>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
const ETIQUETAS_MEDIDA = [
  { valor: "", etiqueta: "— Ninguna —" },
  { valor: "diametro", etiqueta: "Diámetro (mm)" },
  { valor: "grosor", etiqueta: "Grosor (mm)" },
  { valor: "piedra", etiqueta: "Piedra (mm)" },
  { valor: "alto", etiqueta: "Alto (mm)" },
  { valor: "ancho", etiqueta: "Ancho (mm)" },
  { valor: "largo", etiqueta: "Largo (mm)" },
];

function filaMedidaHTML(indice, claveSeleccionada, valorSeleccionado) {
  const opciones = ETIQUETAS_MEDIDA.map(
    (o) => `<option value="${o.valor}" ${o.valor === claveSeleccionada ? "selected" : ""}>${o.etiqueta}</option>`
  ).join("");
  return `
    <div class="fila-medida" style="margin-bottom:10px;">
      <select data-medida-clave="${indice}">${opciones}</select>
      <input type="number" step="0.01" data-medida-valor="${indice}" placeholder="Valor en mm" value="${valorSeleccionado ?? ""}">
    </div>
  `;
}

function pintarFilasMedidas(medidas = {}) {
  const claves = Object.keys(medidas);
  const contenedor = document.getElementById("filas-medidas");
  let html = "";
  for (let i = 0; i < 3; i++) {
    const clave = claves[i] || "";
    html += filaMedidaHTML(i, clave, clave ? medidas[clave] : "");
  }
  contenedor.innerHTML = html;
}

function leerMedidasDelFormulario() {
  const medidas = {};
  for (let i = 0; i < 3; i++) {
    const claveEl = document.querySelector(`[data-medida-clave="${i}"]`);
    const valorEl = document.querySelector(`[data-medida-valor="${i}"]`);
    if (!claveEl || !valorEl) continue;
    if (claveEl.value && valorEl.value !== "") medidas[claveEl.value] = Number(valorEl.value);
  }
  return medidas;
}

let tallasActuales = [];

function renderChipsTallas() {
  const contenedor = document.getElementById("chips-tallas");
  contenedor.innerHTML = tallasActuales
    .map(
      (t, i) => `
      <span class="chip-talla">
        ${t}
        <button type="button" data-quitar-talla="${i}" title="Quitar">✕</button>
      </span>
    `
    )
    .join("");
}

function agregarTalla() {
  const campo = document.getElementById("nueva-talla");
  const valor = campo.value.trim();
  if (!valor) return;
  const normalizada = isNaN(Number(valor)) ? valor : Number(valor);
  if (!tallasActuales.includes(normalizada)) {
    tallasActuales.push(normalizada);
    renderChipsTallas();
  }
  campo.value = "";
  campo.focus();
}

document.getElementById("btn-agregar-talla").addEventListener("click", agregarTalla);
document.getElementById("nueva-talla").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === ",") {
    e.preventDefault();
    agregarTalla();
  }
});
document.getElementById("chips-tallas").addEventListener("click", (e) => {
  const boton = e.target.closest("button[data-quitar-talla]");
  if (!boton) return;
  tallasActuales.splice(Number(boton.getAttribute("data-quitar-talla")), 1);
  renderChipsTallas();
});

const TAMANO_MAXIMO_IMAGEN = 20 * 1024 * 1024;
let imagenesActuales = [];

function renderGaleriaImagenesAdmin() {
  const contenedor = document.getElementById("galeria-imagenes-admin");
  contenedor.innerHTML = imagenesActuales
    .map(
      (url, i) => `
      <div class="miniatura-admin-editable">
        <div class="miniatura-admin"><img src="${url}" alt="Imagen ${i + 1}"></div>
        ${i === 0 ? '<span class="badge-tipo">Portada</span>' : ""}
        <div class="miniatura-acciones">
          ${i > 0 ? `<button type="button" data-mover="${i}" title="Mover antes">↑</button>` : ""}
          <button type="button" data-quitar="${i}" title="Quitar">✕</button>
        </div>
      </div>
    `
    )
    .join("");
}

/**
 * Sube el archivo directo desde el navegador a Vercel Blob (sin pasar por
 * nuestra función de servidor). Vercel limita el body de una función a
 * 4.5 MB, así que el viejo flujo de JSON+base64 fallaba con 413 para
 * cualquier archivo real arriba de ~3.2 MB codificado — aunque el mensaje
 * dijera "máx. 8/20 MB". El módulo se importa dinámicamente porque este
 * sitio no tiene paso de build/bundler.
 */
async function subirDirectoABlob(pathname, archivo, contexto) {
  const { upload } = await import("https://esm.sh/@vercel/blob@2.8.0/client");
  const blob = await upload(pathname, archivo, {
    access: "public",
    handleUploadUrl: "/api/admin/upload-token",
    clientPayload: JSON.stringify({ contexto }),
  });
  return blob.url;
}

document.getElementById("galeria-imagenes-admin").addEventListener("click", async (e) => {
  const btnQuitar = e.target.closest("button[data-quitar]");
  const btnMover = e.target.closest("button[data-mover]");

  if (btnQuitar) {
    const indice = Number(btnQuitar.getAttribute("data-quitar"));
    const url = imagenesActuales[indice];
    if (!confirm("¿Quitar esta imagen del producto?")) return;
    imagenesActuales.splice(indice, 1);
    renderGaleriaImagenesAdmin();
    fetch("/api/admin/borrar-imagen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    }).catch(() => {});
  }

  if (btnMover) {
    const indice = Number(btnMover.getAttribute("data-mover"));
    [imagenesActuales[indice - 1], imagenesActuales[indice]] = [imagenesActuales[indice], imagenesActuales[indice - 1]];
    renderGaleriaImagenesAdmin();
  }
});

const EXTENSION_POR_TIPO_IMAGEN = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };

document.getElementById("archivo-imagen").addEventListener("change", async (e) => {
  const archivos = Array.from(e.target.files || []);
  const mensaje = document.getElementById("mensaje-imagen");
  mensaje.textContent = "";
  mensaje.className = "mensaje-admin";
  if (archivos.length === 0) return;

  const referenciaActual = (document.getElementById("referencia").value || "producto").trim().toUpperCase() || "PRODUCTO";
  let subidas = 0;

  for (const archivo of archivos) {
    const extension = EXTENSION_POR_TIPO_IMAGEN[archivo.type];
    if (!extension) {
      mensaje.textContent = `"${archivo.name}" no es JPG, PNG ni WEBP — se omitió.`;
      mensaje.className = "mensaje-admin error";
      continue;
    }
    if (archivo.size > TAMANO_MAXIMO_IMAGEN) {
      mensaje.textContent = `"${archivo.name}" supera 20 MB — se omitió.`;
      mensaje.className = "mensaje-admin error";
      continue;
    }

    mensaje.textContent = `Subiendo ${subidas + 1} de ${archivos.length}...`;
    mensaje.className = "mensaje-admin";

    try {
      const pathname = `productos/${referenciaActual}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${extension}`;
      const url = await subirDirectoABlob(pathname, archivo, "imagen");

      imagenesActuales.push(url);
      renderGaleriaImagenesAdmin();
      subidas++;
    } catch (err) {
      mensaje.textContent = err.message || `No se pudo subir "${archivo.name}".`;
      mensaje.className = "mensaje-admin error";
    }
  }

  if (subidas === archivos.length) {
    mensaje.textContent = `${subidas} imagen(es) subida(s) correctamente.`;
    mensaje.className = "mensaje-admin ok";
  }
  e.target.value = "";
});

const TAMANO_MAXIMO_STL = 150 * 1024 * 1024;

function mostrarEstadoStl(url) {
  const estado = document.getElementById("estado-stl");
  estado.innerHTML = url
    ? `✓ Archivo STL cargado — <a href="${url}" target="_blank" rel="noopener">ver / descargar</a>`
    : "Sin archivo STL todavía.";
}

document.getElementById("archivo-stl").addEventListener("change", async (e) => {
  const archivo = e.target.files[0];
  const mensaje = document.getElementById("mensaje-stl");
  mensaje.textContent = "";
  mensaje.className = "mensaje-admin";
  if (!archivo) return;

  if (!/\.stl$/i.test(archivo.name)) {
    mensaje.textContent = "El archivo debe tener extensión .stl";
    mensaje.className = "mensaje-admin error";
    e.target.value = "";
    return;
  }
  if (archivo.size > TAMANO_MAXIMO_STL) {
    mensaje.textContent = "El archivo STL no puede superar 150 MB.";
    mensaje.className = "mensaje-admin error";
    e.target.value = "";
    return;
  }

  mensaje.textContent = "Subiendo archivo STL...";

  try {
    const referenciaActual = (document.getElementById("referencia").value || "producto").trim().toUpperCase() || "PRODUCTO";
    const urlAnterior = document.getElementById("modeloStl").value;

    const pathname = `modelos-stl/${referenciaActual}-${Date.now()}.stl`;
    const url = await subirDirectoABlob(pathname, archivo, "stl");

    document.getElementById("modeloStl").value = url;
    mostrarEstadoStl(url);
    mensaje.textContent = "Archivo STL subido correctamente.";
    mensaje.className = "mensaje-admin ok";

    if (urlAnterior) {
      fetch("/api/admin/borrar-imagen", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: urlAnterior }),
      }).catch(() => {});
    }
  } catch (err) {
    mensaje.textContent = err.message || "No se pudo subir el archivo STL.";
    mensaje.className = "mensaje-admin error";
  } finally {
    e.target.value = "";
  }
});

async function cargarSugerenciasSubcategoria() {
  try {
    const r = await fetch("/api/admin/productos");
    if (!r.ok) return;
    const productos = await r.json();
    const subcategorias = [...new Set(productos.map((p) => p.subcategoria).filter(Boolean))].sort();
    document.getElementById("lista-subcategorias").innerHTML = subcategorias
      .map((s) => `<option value="${s}">`)
      .join("");
  } catch (err) {
    // No es crítico: el campo sigue funcionando como texto libre sin sugerencias.
  }
}

const params = new URLSearchParams(window.location.search);
const referenciaEdicion = params.get("ref");

async function cargarProductoParaEditar() {
  document.getElementById("titulo-formulario").textContent = `Editar ${referenciaEdicion}`;
  document.getElementById("referencia").value = referenciaEdicion;
  document.getElementById("referencia").disabled = true;

  const r = await fetch(`/api/admin/productos?referencia=${encodeURIComponent(referenciaEdicion)}`);
  if (r.status === 401) {
    window.location.href = "/admin/login.html";
    return;
  }
  if (!r.ok) {
    document.getElementById("mensaje-formulario").textContent = "No se encontró ese producto.";
    document.getElementById("mensaje-formulario").className = "mensaje-admin error";
    return;
  }
  const p = await r.json();

  document.getElementById("tipo").value = p.tipo;
  document.getElementById("subcategoria").value = p.subcategoria || "";
  document.getElementById("nombre").value = p.nombre;
  document.getElementById("descripcion").value = p.descripcion || "";
  document.getElementById("peso").value = p.peso;
  document.getElementById("pesoCera").value = p.pesoCera;
  document.getElementById("materialTipo").value = p.materialTipo || "Oro 18k";
  document.getElementById("precioBase").value = p.precioBase;
  document.getElementById("material").value = p.material || "";
  imagenesActuales = p.imagenes ? [...p.imagenes] : [];
  renderGaleriaImagenesAdmin();
  document.getElementById("modeloStl").value = p.modeloStl || "";
  mostrarEstadoStl(p.modeloStl);
  tallasActuales = p.tallas ? [...p.tallas] : [];
  renderChipsTallas();
  pintarFilasMedidas(p.medidas || {});
}

document.getElementById("form-producto").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById("mensaje-formulario");
  mensaje.textContent = "";
  mensaje.className = "mensaje-admin";

  const cuerpo = {
    referencia: document.getElementById("referencia").value,
    tipo: document.getElementById("tipo").value,
    subcategoria: document.getElementById("subcategoria").value,
    nombre: document.getElementById("nombre").value,
    descripcion: document.getElementById("descripcion").value,
    peso: document.getElementById("peso").value,
    pesoCera: document.getElementById("pesoCera").value,
    materialTipo: document.getElementById("materialTipo").value,
    precioBase: document.getElementById("precioBase").value,
    material: document.getElementById("material").value,
    imagenes: imagenesActuales,
    modeloStl: document.getElementById("modeloStl").value,
    tallas: tallasActuales,
    medidas: leerMedidasDelFormulario(),
  };

  const url = referenciaEdicion
    ? `/api/admin/productos?referencia=${encodeURIComponent(referenciaEdicion)}`
    : "/api/admin/productos";
  const metodo = referenciaEdicion ? "PUT" : "POST";

  try {
    const r = await fetch(url, {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo),
    });
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) {
      mensaje.textContent = datos.error || "No se pudo guardar el producto.";
      mensaje.className = "mensaje-admin error";
      return;
    }
    window.location.href = "/admin/productos.html";
  } catch (err) {
    mensaje.textContent = "Error de conexión. Intenta de nuevo.";
    mensaje.className = "mensaje-admin error";
  }
});

renderAdminSidebar("productos");

(async () => {
  cargarSugerenciasSubcategoria();
  if (referenciaEdicion) {
    await cargarProductoParaEditar();
  } else {
    document.getElementById("materialTipo").value = "Oro 18k";
    pintarFilasMedidas({});
    mostrarEstadoStl("");
    renderGaleriaImagenesAdmin();
    renderChipsTallas();
  }
})();
</script>
</body>
</html>
