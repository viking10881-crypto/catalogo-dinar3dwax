<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-login-shell">
  <div class="admin-login-card">
    <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
    <h1>Panel de administración</h1>
    <span class="subtitulo">Dinar 3D Wax</span>

    <form id="form-login" class="formulario-datos">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit" class="btn btn-dorado btn-full" style="margin-top:18px;">Ingresar</button>
      <p id="mensaje-login" class="mensaje-admin error"></p>
    </form>
  </div>
</div>

<script>
document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById("mensaje-login");
  mensaje.textContent = "";
  const password = document.getElementById("password").value;

  try {
    const r = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (!r.ok) {
      const datos = await r.json().catch(() => ({}));
      mensaje.textContent = datos.error || "No se pudo iniciar sesión";
      return;
    }
    window.location.href = "/admin/index.html";
  } catch (err) {
    mensaje.textContent = "Error de conexión. Intenta de nuevo.";
  }
});
</script>
</body>
</html>
