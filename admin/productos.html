<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Productos</h1>
      <a href="/admin/producto.html" class="btn btn-dorado">+ Nuevo producto</a>
    </div>

    <div class="barra-tabla-productos">
      <input type="text" id="buscador-productos" placeholder="Buscar por referencia, nombre o categoría…">
      <label class="etiqueta-tamano-pagina">
        Mostrar
        <select id="tamano-pagina">
          <option value="10">10</option>
          <option value="30">30</option>
          <option value="100">100</option>
        </select>
        productos
      </label>
    </div>

    <div style="overflow-x:auto;">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Referencia</th>
            <th>Tipo</th>
            <th>Nombre</th>
            <th>Peso</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-productos"></tbody>
      </table>
    </div>

    <div class="paginacion-productos">
      <span id="resumen-paginacion"></span>
      <div class="botones-paginacion">
        <button type="button" id="btn-pagina-anterior" class="btn btn-borde">‹ Anterior</button>
        <span id="indicador-pagina"></span>
        <button type="button" id="btn-pagina-siguiente" class="btn btn-borde">Siguiente ›</button>
      </div>
    </div>

    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
let todosLosProductos = [];
let paginaActual = 1;

function filaProductoHTML(p) {
  return `
    <tr>
      <td>${(p.imagenes && p.imagenes[0]) ? `<div class="miniatura-admin" style="width:44px;height:44px;"><img src="${p.imagenes[0]}" alt="${p.nombre}" onerror="this.parentElement.remove()"></div>` : ""}</td>
      <td>${p.referencia}</td>
      <td><span class="badge-tipo">${p.tipo}</span></td>
      <td>${p.nombre} ${p.modeloStl ? '<span class="badge-tipo" title="Tiene archivo STL">🧊 STL</span>' : ""}</td>
      <td>${p.peso} g</td>
      <td>${formatearPrecioAdmin(p.precioBase)}</td>
      <td>
        <div class="acciones-fila">
          <a href="/admin/producto.html?ref=${encodeURIComponent(p.referencia)}">Editar</a>
          <button type="button" class="eliminar" data-ref="${p.referencia}">Eliminar</button>
        </div>
      </td>
    </tr>
  `;
}

function productosFiltrados() {
  const termino = document.getElementById("buscador-productos").value.trim().toLowerCase();
  if (!termino) return todosLosProductos;
  return todosLosProductos.filter(
    (p) =>
      p.referencia.toLowerCase().includes(termino) ||
      p.nombre.toLowerCase().includes(termino) ||
      p.tipo.toLowerCase().includes(termino)
  );
}

function renderizarTabla() {
  const cuerpo = document.getElementById("cuerpo-tabla-productos");
  const tamanoPagina = Number(document.getElementById("tamano-pagina").value);
  const filtrados = productosFiltrados();
  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / tamanoPagina));
  paginaActual = Math.min(paginaActual, totalPaginas);

  if (filtrados.length === 0) {
    const vacioTexto =
      todosLosProductos.length === 0
        ? 'Todavía no hay productos. Crea el primero con "Nuevo producto".'
        : "Ningún producto coincide con la búsqueda.";
    cuerpo.innerHTML = `<tr><td colspan="7" class="tabla-vacia">${vacioTexto}</td></tr>`;
  } else {
    const inicio = (paginaActual - 1) * tamanoPagina;
    const pagina = filtrados.slice(inicio, inicio + tamanoPagina);
    cuerpo.innerHTML = pagina.map(filaProductoHTML).join("");
  }

  document.getElementById("resumen-paginacion").textContent =
    filtrados.length === 0
      ? ""
      : `${filtrados.length} producto${filtrados.length === 1 ? "" : "s"}${filtrados.length !== todosLosProductos.length ? ` (de ${todosLosProductos.length})` : ""}`;
  document.getElementById("indicador-pagina").textContent = `Página ${paginaActual} de ${totalPaginas}`;
  document.getElementById("btn-pagina-anterior").disabled = paginaActual <= 1;
  document.getElementById("btn-pagina-siguiente").disabled = paginaActual >= totalPaginas;
}

async function cargarTabla() {
  const mensaje = document.getElementById("mensaje-tabla");
  try {
    const r = await fetch("/api/admin/productos");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    todosLosProductos = await r.json();
    renderizarTabla();
  } catch (err) {
    mensaje.textContent = "No se pudo cargar el listado de productos.";
    mensaje.className = "mensaje-admin error";
  }
}

document.getElementById("buscador-productos").addEventListener("input", () => {
  paginaActual = 1;
  renderizarTabla();
});
document.getElementById("tamano-pagina").addEventListener("change", () => {
  paginaActual = 1;
  renderizarTabla();
});
document.getElementById("btn-pagina-anterior").addEventListener("click", () => {
  paginaActual -= 1;
  renderizarTabla();
});
document.getElementById("btn-pagina-siguiente").addEventListener("click", () => {
  paginaActual += 1;
  renderizarTabla();
});

document.getElementById("cuerpo-tabla-productos").addEventListener("click", async (e) => {
  const boton = e.target.closest("button.eliminar");
  if (!boton) return;
  const ref = boton.getAttribute("data-ref");
  if (!confirm(`¿Eliminar el producto ${ref}? Esta acción no se puede deshacer.`)) return;

  try {
    const r = await fetch(`/api/admin/productos?referencia=${encodeURIComponent(ref)}`, { method: "DELETE" });
    if (!r.ok) throw new Error("fallo al eliminar");
    cargarTabla();
  } catch (err) {
    alert("No se pudo eliminar el producto.");
  }
});

renderAdminSidebar("productos");
cargarTabla();
</script>
</body>
</html>
