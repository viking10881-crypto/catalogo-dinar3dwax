<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <span class="logo">DINAR 3D WAX</span>
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Productos</h1>
      <a href="/admin/producto.html" class="btn btn-dorado">+ Nuevo producto</a>
    </div>

    <div style="overflow-x:auto;">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Referencia</th>
            <th>Tipo</th>
            <th>Nombre</th>
            <th>Peso</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-productos"></tbody>
      </table>
    </div>
    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
async function cargarTabla() {
  const cuerpo = document.getElementById("cuerpo-tabla-productos");
  const mensaje = document.getElementById("mensaje-tabla");

  try {
    const r = await fetch("/api/admin/productos");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    const productos = await r.json();

    if (productos.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="7" class="tabla-vacia">Todavía no hay productos. Crea el primero con "Nuevo producto".</td></tr>`;
      return;
    }

    cuerpo.innerHTML = productos
      .map(
        (p) => `
        <tr>
          <td>${(p.imagenes && p.imagenes[0]) ? `<div class="miniatura-admin" style="width:44px;height:44px;"><img src="${p.imagenes[0]}" alt="${p.nombre}" onerror="this.parentElement.remove()"></div>` : ""}</td>
          <td>${p.referencia}</td>
          <td><span class="badge-tipo">${p.tipo}</span></td>
          <td>${p.nombre} ${p.modeloStl ? '<span class="badge-tipo" title="Tiene archivo STL">🧊 STL</span>' : ""}</td>
          <td>${p.peso} g</td>
          <td>${formatearPrecioAdmin(p.precioBase)}</td>
          <td class="acciones-fila">
            <a href="/admin/producto.html?ref=${encodeURIComponent(p.referencia)}">Editar</a>
            <button type="button" class="eliminar" data-ref="${p.referencia}">Eliminar</button>
          </td>
        </tr>
      `
      )
      .join("");
  } catch (err) {
    mensaje.textContent = "No se pudo cargar el listado de productos.";
    mensaje.className = "mensaje-admin error";
  }
}

document.getElementById("cuerpo-tabla-productos").addEventListener("click", async (e) => {
  const boton = e.target.closest("button.eliminar");
  if (!boton) return;
  const ref = boton.getAttribute("data-ref");
  if (!confirm(`¿Eliminar el producto ${ref}? Esta acción no se puede deshacer.`)) return;

  try {
    const r = await fetch(`/api/admin/productos/${encodeURIComponent(ref)}`, { method: "DELETE" });
    if (!r.ok) throw new Error("fallo al eliminar");
    cargarTabla();
  } catch (err) {
    alert("No se pudo eliminar el producto.");
  }
});

renderAdminSidebar("productos");

(async () => {
  const autenticado = await exigirSesion();
  if (autenticado) cargarTabla();
})();
</script>
</body>
</html>
