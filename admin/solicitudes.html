<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css?v=5">
<link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Solicitudes</h1>
      <select id="filtro-estado" class="estado-solicitud" aria-label="Filtrar por estado">
        <option value="">Todas</option>
      </select>
    </div>
    <p style="color:var(--gris); font-size:0.85rem; margin-top:-6px;">
      Lo que los clientes envían desde <a href="/#servicios-3d" target="_blank" rel="noopener" style="color:var(--dorado);">Servicios 3D ↗</a> e <a href="/#impresion-stl" target="_blank" rel="noopener" style="color:var(--dorado);">Impresión STL ↗</a>. Cada solicitud nueva también llega por correo.
    </p>

    <div style="overflow-x:auto;">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Idea</th>
            <th>Referencia</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-solicitudes"></tbody>
      </table>
    </div>
    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js?v=5"></script>
<script src="/admin/js/layout.js?v=5"></script>
<script>
let todasLasSolicitudes = [];

function formatearFechaHora(iso) {
  return new Date(iso).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short", timeZone: "America/Bogota" });
}

function linkWhatsapp(s) {
  const digitos = numeroWhatsapp(s.whatsapp);
  const texto = s.tipoSolicitud === "impresion"
    ? `Hola ${s.nombre}, te escribimos de Dinar 3D Wax por tu solicitud de impresión (${s.archivoNombre}).`
    : `Hola ${s.nombre}, te escribimos de Dinar 3D Wax por tu solicitud de diseño (${s.tipoJoya}).`;
  return `https://wa.me/${digitos}?text=${encodeURIComponent(texto)}`;
}

function filaSolicitudHTML(s) {
  return `
    <tr class="fila-solicitud" data-id="${s.id}">
      <td>${formatearFechaHora(s.creadoEn)}</td>
      <td>
        <strong>${escaparHtml(s.nombre)}</strong><br>
        <a href="${linkWhatsapp(s)}" target="_blank" rel="noopener" style="color:var(--dorado);">${escaparHtml(s.whatsapp)} ↗</a>
      </td>
      <td>${
        s.tipoSolicitud === "impresion"
          ? `<strong>Impresión STL</strong><br><span style="color:var(--gris); font-size:0.82rem;">${s.cantidad} pieza${s.cantidad === 1 ? "" : "s"}</span>`
          : `${escaparHtml(s.tipoJoya)}<br><span style="color:var(--gris); font-size:0.82rem;">${escaparHtml(s.presupuesto)}</span>`
      }</td>
      <td><div class="descripcion-solicitud">${escaparHtml(s.descripcion)}</div></td>
      <td>${
        s.archivoUrl
          ? `<a href="${escaparHtml(s.archivoUrl)}" target="_blank" rel="noopener" style="color:var(--dorado);">${escaparHtml(s.archivoNombre || "Ver archivo")} ↗</a>`
          : "—"
      }</td>
      <td><span class="estado-solicitud" data-estado="${s.estado}">${etiquetaEstadoSolicitud(s.estado)}</span>${
        s.precioCotizado != null ? `<br><span style="color:var(--gris); font-size:0.82rem;">${formatearPrecioAdmin(s.precioCotizado)}</span>` : ""
      }</td>
      <td>
        <div class="acciones-fila">
          <a href="/admin/solicitud.html?id=${s.id}" class="btn-ver-pedido">Abrir</a>
        </div>
      </td>
    </tr>
  `;
}

function renderizarTabla() {
  const cuerpo = document.getElementById("cuerpo-tabla-solicitudes");
  const filtro = document.getElementById("filtro-estado").value;
  const visibles = filtro ? todasLasSolicitudes.filter((s) => s.estado === filtro) : todasLasSolicitudes;
  if (visibles.length === 0) {
    cuerpo.innerHTML = `<tr><td colspan="7" class="tabla-vacia">${
      filtro ? "No hay solicitudes con este estado." : "Todavía no han llegado solicitudes de diseño."
    }</td></tr>`;
    return;
  }
  cuerpo.innerHTML = visibles.map(filaSolicitudHTML).join("");
}

async function cargarTabla() {
  const mensaje = document.getElementById("mensaje-tabla");
  try {
    const r = await fetch("/api/admin/solicitudes");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    if (!r.ok) throw new Error();
    todasLasSolicitudes = await r.json();
    mensaje.textContent = "";
    renderizarTabla();
  } catch (err) {
    mensaje.textContent = "No se pudieron cargar las solicitudes.";
    mensaje.className = "mensaje-admin error";
  }
}

const filtroEstado = document.getElementById("filtro-estado");
filtroEstado.insertAdjacentHTML(
  "beforeend",
  ESTADOS_SOLICITUD.map((e) => `<option value="${e.valor}">${e.etiqueta}</option>`).join("")
);
filtroEstado.addEventListener("change", renderizarTabla);

// Toda la fila abre el detalle, salvo los links propios (WhatsApp, archivo).
document.getElementById("cuerpo-tabla-solicitudes").addEventListener("click", (e) => {
  const fila = e.target.closest("tr.fila-solicitud");
  if (!fila || e.target.closest("a")) return;
  window.location.href = `/admin/solicitud.html?id=${fila.getAttribute("data-id")}`;
});

renderAdminSidebar("solicitudes");
cargarTabla();
</script>
</body>
</html>
