<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes de diseño · Panel Dinar 3D Wax</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/index.html" class="admin-sidebar-marca">
      <img src="/img/logo-dinar3dwax.png" alt="Dinar 3D Wax" class="logo-img">
      <span class="subtitulo">Panel de administración</span>
    </a>
    <nav id="admin-sidebar-nav" class="admin-sidebar-nav"></nav>
    <div class="admin-sidebar-pie">
      <a href="/index.html" target="_blank" rel="noopener">Ver catálogo ↗</a>
      <button type="button" id="btn-cerrar-sesion">Salir</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-cabecera-fila">
      <h1 class="titulo-seccion" style="margin:0;">Solicitudes de diseño</h1>
      <select id="filtro-estado" class="estado-solicitud" aria-label="Filtrar por estado">
        <option value="">Todas</option>
        <option value="nueva">Nuevas</option>
        <option value="en_proceso">En proceso</option>
        <option value="respondida">Respondidas</option>
        <option value="descartada">Descartadas</option>
      </select>
    </div>
    <p style="color:var(--gris); font-size:0.85rem; margin-top:-6px;">
      Lo que los clientes envían desde la página <a href="/personalizados.html" target="_blank" rel="noopener" style="color:var(--dorado);">Personalizados ↗</a>. Cada solicitud nueva también llega por correo.
    </p>

    <div style="overflow-x:auto;">
      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Joya / presupuesto</th>
            <th>Idea</th>
            <th>Referencia</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-solicitudes"></tbody>
      </table>
    </div>
    <p id="mensaje-tabla" class="mensaje-admin"></p>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
const ESTADOS_SOLICITUD = [
  { valor: "nueva", etiqueta: "Nueva" },
  { valor: "en_proceso", etiqueta: "En proceso" },
  { valor: "respondida", etiqueta: "Respondida" },
  { valor: "descartada", etiqueta: "Descartada" },
];

let todasLasSolicitudes = [];

function formatearFechaHora(iso) {
  return new Date(iso).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short", timeZone: "America/Bogota" });
}

function linkWhatsapp(s) {
  const digitos = s.whatsapp.replace(/\D/g, "");
  const texto = `Hola ${s.nombre}, te escribimos de Dinar 3D Wax por tu solicitud de diseño (${s.tipoJoya}).`;
  return `https://wa.me/${digitos}?text=${encodeURIComponent(texto)}`;
}

function filaSolicitudHTML(s) {
  const opciones = ESTADOS_SOLICITUD.map(
    (e) => `<option value="${e.valor}"${e.valor === s.estado ? " selected" : ""}>${e.etiqueta}</option>`
  ).join("");
  return `
    <tr>
      <td>${formatearFechaHora(s.creadoEn)}</td>
      <td>
        <strong>${escaparHtml(s.nombre)}</strong><br>
        <a href="${linkWhatsapp(s)}" target="_blank" rel="noopener" style="color:var(--dorado);">${escaparHtml(s.whatsapp)} ↗</a>
      </td>
      <td>${escaparHtml(s.tipoJoya)}<br><span style="color:var(--gris); font-size:0.82rem;">${escaparHtml(s.presupuesto)}</span></td>
      <td><div class="descripcion-solicitud">${escaparHtml(s.descripcion)}</div></td>
      <td>${
        s.archivoUrl
          ? `<a href="${escaparHtml(s.archivoUrl)}" target="_blank" rel="noopener" style="color:var(--dorado);">${escaparHtml(s.archivoNombre || "Ver archivo")} ↗</a>`
          : "—"
      }</td>
      <td><select class="estado-solicitud" data-id="${s.id}" data-estado="${s.estado}" aria-label="Estado">${opciones}</select></td>
      <td>
        <div class="acciones-fila">
          <button type="button" class="eliminar" data-id="${s.id}">Eliminar</button>
        </div>
      </td>
    </tr>
  `;
}

function renderizarTabla() {
  const cuerpo = document.getElementById("cuerpo-tabla-solicitudes");
  const filtro = document.getElementById("filtro-estado").value;
  const visibles = filtro ? todasLasSolicitudes.filter((s) => s.estado === filtro) : todasLasSolicitudes;
  if (visibles.length === 0) {
    cuerpo.innerHTML = `<tr><td colspan="7" class="tabla-vacia">${
      filtro ? "No hay solicitudes con este estado." : "Todavía no han llegado solicitudes de diseño."
    }</td></tr>`;
    return;
  }
  cuerpo.innerHTML = visibles.map(filaSolicitudHTML).join("");
}

async function cargarTabla() {
  const mensaje = document.getElementById("mensaje-tabla");
  try {
    const r = await fetch("/api/admin/solicitudes");
    if (r.status === 401) {
      window.location.href = "/admin/login.html";
      return;
    }
    if (!r.ok) throw new Error();
    todasLasSolicitudes = await r.json();
    mensaje.textContent = "";
    renderizarTabla();
  } catch (err) {
    mensaje.textContent = "No se pudieron cargar las solicitudes.";
    mensaje.className = "mensaje-admin error";
  }
}

document.getElementById("filtro-estado").addEventListener("change", renderizarTabla);

document.getElementById("cuerpo-tabla-solicitudes").addEventListener("change", async (e) => {
  const select = e.target.closest("select.estado-solicitud");
  if (!select) return;
  const id = Number(select.getAttribute("data-id"));
  const anterior = select.getAttribute("data-estado");
  try {
    const r = await fetch(`/api/admin/solicitudes?id=${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ estado: select.value }),
    });
    if (!r.ok) throw new Error();
    const solicitud = todasLasSolicitudes.find((s) => s.id === id);
    if (solicitud) solicitud.estado = select.value;
    select.setAttribute("data-estado", select.value);
  } catch (err) {
    select.value = anterior;
    alert("No se pudo cambiar el estado.");
  }
});

document.getElementById("cuerpo-tabla-solicitudes").addEventListener("click", async (e) => {
  const botonEliminar = e.target.closest("button.eliminar");
  if (!botonEliminar) return;
  const id = botonEliminar.getAttribute("data-id");
  if (!confirm("¿Eliminar esta solicitud y su archivo adjunto?")) return;
  try {
    const r = await fetch(`/api/admin/solicitudes?id=${id}`, { method: "DELETE" });
    if (!r.ok) throw new Error();
    cargarTabla();
  } catch (err) {
    alert("No se pudo eliminar la solicitud.");
  }
});

renderAdminSidebar("solicitudes");
cargarTabla();
</script>
</body>
</html>
